<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/aistudio/dayease_81fc60c2.png" />
    <title>DayEase — Calm Daily Planner &amp; Routine Organizer</title>
    <meta
      name="description"
      content="Organize everyday life, build good habits, follow your daily routine, and stay productive with DayEase."
    />
    <meta property="og:title" content="DayEase — Calm Daily Planner & Routine Organizer" />
    <meta
      property="og:description"
      content="Organize everyday life, build good habits, follow your daily routine, and stay productive with DayEase."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('myday_theme_v1') || 'system';
          var isDark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F5F0] dark:bg-[#141414] text-[#292522] dark:text-[#F3EFEA] antialiased selection:bg-[#800020]/15 dark:selection:bg-[#C89B54]/25 selection:text-[#800020] dark:selection:text-[#F3EFEA] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
